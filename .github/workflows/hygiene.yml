name: hygiene

# The mechanical half of AGENTS.md: commits and pull-request text carry no session ids, addresses or
# stray trailers; prose has no em dashes; nothing personal is in the tree; the shell scripts pass
# shellcheck.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: self-test the checker
        run: python3 tools/check-hygiene.py --self-test
      - name: the tree
        run: python3 tools/check-hygiene.py --files
      - name: commits and pull request text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.txt
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD~1..$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          echo "checking $range"
          python3 tools/check-hygiene.py --range "$range" --text /tmp/pr-title.txt --text /tmp/pr-body.txt
      - name: shellcheck
        run: shellcheck -S warning tools/*.sh packaging/*.sh
